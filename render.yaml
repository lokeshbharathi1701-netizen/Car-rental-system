services:
  # Backend Web Service
  - type: web
    name: car-rental-backend
    env: node
    rootDir: backend
    buildCommand: npm install
    startCommand: node server.js
    envVars:
      - key: MONGODB_URI
        sync: false # You will need to provide your MongoDB URI in the Render Dashboard
      - key: PORT
        value: 5000

  # Frontend Static Site
  - type: static
    name: car-rental-frontend
    env: static
    rootDir: car-rental-app
    buildCommand: npm install && npm run build
    publishDir: dist
    envVars:
      - key: VITE_API_URL
        value: https://car-rental-backend.onrender.com/api
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
